[package]
name = "vm-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.9"
actix-multipart = "0.8.0"
actix-web = "4.12.1"
anyhow = "1.0.100"
base64 = "0.22.1"
serde = "1.0.228"
serde_json = "1.0.148"
shell-words = "1.1.1"
tokio = { version="1.49.0", features=["fs"] }
padsi = { path = "../padsi" }
urlencoding = "2.1.3"
tokio-util = "0.7.18"

[target.'cfg(unix)'.dependencies]
uzers = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_NetManagement",
    "Win32_Foundation",
]}
windows-service = "0.8.0"
