[package]
name = "padsi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
pem = "3.0.2"
pem-rfc7468 = { version="0.7.0", features=[ "alloc" ] }
rand = "0.9.2"
rcgen = { version = "0.14.5", features=[ "pem" ] }
ring = "0.17"
rustls = "0.23.32"
rustls-pki-types = { version="1.12.0", features=[ "std" ] }
tempfile = "3.23.0"
time = "0.3.44"
x509-parser = "0.18.0"
regex = "1.12.2"
ipnetwork = { version = "0.21.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio =  { version = "1.47.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version="0.3.22", features=["json"]}
syslog-tracing = "0.3.1"
