[package]
name = "web-infra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["tokio"]}
rustls = "0.23.32"
tokio =  { version = "1.47.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.16", features = ["full"] }
padsi = { path = "../padsi" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = "0.3.44"
regex = "1.12.2"
ipnetwork = "0.21.1"
tempfile = "3.23.0"

[profile.release]
strip = "symbols"
