<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blocked web site</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      border: 2px solid #ccc;
      padding: 30px;
      width: 400px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      text-align: center;
    }

    .header-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 15px;
    }

    .header-image {
        width: 60px;
        height: auto;
        margin-bottom: 10px;
    }

    h1 {
      margin-bottom: 0px;
    }

    p {
        margin-bottom: 25px;
        color: #555;
    }

  </style>
</head>
<body>
  <div class="container">
    <img src="/padsi-redir/blocked-icon.png" alt="blocked icon" class="header-image" />
      <h1>Web site is blocked</h1>
      <p>This web browser can't access the requested site.</p>
    </div>
  </div>
</body>
</html>
