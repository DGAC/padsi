{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": ["tapvm"],
            "service-sockets-max-retries": 5,
            "service-sockets-retry-wait-time": 1000
        },

        "authoritative": true,

        "ddns-send-updates" : false,

        "lease-database": {
            "type": "memfile",
            "persist": true,
            "name": "/tmp/kea-leases4.csv",
            "lfc-interval": 3600
        },

        "renew-timer": 14400,
        "rebind-timer": 27720,
        "valid-lifetime": 28800,

        "option-data": [
            {
                "name": "domain-name-servers",
                "data": "9.9.9.9"
            }
        ],

        "subnet4": [
            {
                "subnet": "192.168.244.0/24",
                "pools": [
                    {
                        "pool": "192.168.244.10 - 192.168.244.20"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "192.168.244.1"
                    }
                ]
            }
        ],

        "loggers": [
            {
            "name": "kea-dhcp4",
            "output_options": [
                {
                "output": "/tmp/kea-dhcp4.log",
                "pattern": "%d{%Y-%m-%d %H:%M:%S.%q} %-5p %m\n"
                }
            ],
            "severity": "DEBUG",
            "debuglevel": 0
            }
      ]
    }
}
